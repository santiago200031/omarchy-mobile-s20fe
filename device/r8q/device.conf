# SPDX-License-Identifier: MIT
# Guarded SM8250 descriptor for Samsung Galaxy S20 FE (r8q).
# r8q uses a single-slot (non-A/B) partition layout and Samsung bootloader,
# so BOOT_METHOD=ram-only ensures generic image, flash, push and installer
# paths refuse this descriptor before touching a phone.
CODENAME=r8q
NAME="Samsung Galaxy S20 FE"
SOC=sm8250
COMPATIBLE="samsung,r8q"
BOOT_METHOD=ram-only
BOOT_IMAGES=""
UFS_RW=""
NV_PARTS="efs sec_efs persist modemst1 modemst2 fsg fsc"
NV_BACKUP_EXTRA="param steady devinfo"
PACKAGE=omamobile-device-r8q
DTB=qcom/sm8250-samsung-r8q.dtb
PANEL_SIZE=1080x2400
