# SPDX-License-Identifier: MIT
# The r8q stable boot image: the last kernel verified end-to-end on the
# reference phone before the SDX55M modem bring-up began (camera-uw,
# 2026-11-17). It is the way back from every modem experiment: the modem
# branches (modem-stage2, modem-stage3) are packed from their own output
# trees and live only on sda24 until this image replaces them again.
#
# What "stable" means here, and why each line is pinned:
#   - the image bytes themselves (SHA256): a rebuilt kernel is a different
#     kernel, so a rebuild needs its own pass and a new record, never a
#     silent replacement of this one;
#   - the release string: the phone must report it after the reboot, and
#     the modules for it are already installed (a release without its
#     modules boots without its drivers);
#   - PCIe2 and its PHY stay "disabled" in the packed DTB and the modem
#     overlay is not applied, so nothing powers the external SDX55M at
#     boot (a modem power-on with the Stage 3A kernel reset the phone);
#   - no Sahara loader and no mhi_pci_generic blacklist on the phone:
#     the stable phone runs stock drivers with no bring-up leftovers.
#
# tools/r8q-stable-check reads this file and checks both the packed image
# and the running phone. tools/r8q-flash-recovery --stable restores the
# image, and refuses if its bytes no longer hash to STABLE_SHA256.
#
# Sourced by those tools; keep it plain shell assignments.

STABLE_RELEASE=7.3.0-rc6-omamobile-push1-g3667ab368ef9
STABLE_OUT=out-r8q-uw
STABLE_IMAGE=recovery-cam-uw.img
STABLE_SHA256=66fe127ffd9345e7913aec5eac8a02de0da44bfdbe15987abff1cb61b26d8503
STABLE_PACK_ARGS="--dual-boot --overlay camera-uw"
STABLE_PARTITION=/dev/sda24
