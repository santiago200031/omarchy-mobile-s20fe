# SPDX-License-Identifier: MIT
# The r8q stable boot image: the native-root daily state (2026-11-20,
# NOTES.md 43). The previous pin (g3667ab368ef9, the SD-loop era) stays
# in git history; the microSD is dying and is out of the boot path.
#
# What "stable" means here, and why each line is pinned:
#   - the image bytes themselves (SHA256): a rebuilt kernel is a different
#     kernel, so a rebuild needs its own pass and a new record, never a
#     silent replacement of this one;
#   - the release string: the phone must report it after the reboot, and
#     the modules for it are already installed on the native root (a
#     release without its modules boots without its drivers);
#   - no modem overlay and PCIe2/its PHY stay "disabled" in the packed
#     DTB, so nothing powers the external SDX55M at boot;
#   - the GPU compute wedge (the adreno SMMU's CX vote, NOTES.md 39) is
#     open but does not touch the daily path — compositing and the
#     desktop are unaffected. The fix (r8q-gpu-smmu-vote) gets its own
#     pass and re-pins this file.
#
# tools/r8q-stable-check reads this file and checks both the packed image
# and the running phone. tools/r8q-flash-recovery --stable restores the
# image, and refuses if its bytes no longer hash to STABLE_SHA256.
#
# Restoring means TWO steps: flash the image, and push this release's
# modules (`KERNEL_OUT=~/omamobile-kernel/out-r8q bin/omamobile
# modules-push`), then reboot. The image alone boots with an empty
# /usr/lib/modules/<release>, so msm cannot load and the screen stays
# black (simpledrm only, all-black fb0, Hyprland without a render node).
#
# Sourced by those tools; keep it plain shell assignments.

STABLE_RELEASE=7.3.0-rc6-omamobile-push1-gae195e6deaac
STABLE_OUT=out-r8q
STABLE_IMAGE=recovery-fault-quiesce.img
STABLE_SHA256=adeddb31faa4a263616ff8383b80e0316b3c1bcff2ea6f8004dd02f207d660a
STABLE_PACK_ARGS=""
STABLE_PARTITION=/dev/sda24
