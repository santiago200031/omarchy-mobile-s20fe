# The r8q stable boot image (2026-11-22): the overlay-free base-DTS fold on
# branch r8q-base-dts-fold (HEAD 4d235a595f28), verified live on the phone.
# The previous pin (gae195e6deaac, the fault-quiesce era) stays in git history.
#
# tools/r8q-stable-check reads this file and checks both the packed image
# and the running phone. tools/r8q-flash-recovery --stable restores the
# image, and refuses if its bytes no longer hash to STABLE_SHA256.
#
# Restoring means TWO steps: flash the image, and push this release's
# modules (`KERNEL_OUT=~/omamobile-kernel/out-r8q bin/omamobile
# modules-push`), then reboot. The image alone boots with an empty
# /usr/lib/modules/<release>, so msm cannot load and the screen stays
# black (simpledrm only, all-black fb0, Hyprland without a render node).
#
# Sourced by those tools; keep it plain shell assignments.

STABLE_RELEASE=7.3.0-rc6-omamobile-push1-g4d235a595f28
STABLE_OUT=out-r8q
STABLE_IMAGE=recovery-stable-20261122.img
STABLE_SHA256=f84a754ad5d28935998b396ab08e4b6051abcf0e3969e40897c611bd4fb3464e
STABLE_PACK_ARGS=""
STABLE_PARTITION=/dev/sda24
