# Default configuration for omamobile-ai.
# Device packages can drop a file in /etc/omamobile-ai.conf.d/ that overrides
# any of these settings.  Only the keys that need changing are required.

# Path to the GGUF model file.
# Must exist and be readable before the first request.
MODEL_PATH=/usr/share/omamobile-ai/models/LFM3-1.7B-Q4_K_M.gguf

# The id clients ask for in OpenAI requests (/v1/models reports this).
MODEL_ID=LFM3-1.7B

# Where llama-server lives (an absolute path if it is not on PATH).
LLAMA_BIN=llama-server

# Bind address for the supervisor.
# 127.0.0.1 is phone-only. Use 0.0.0.0 (or the USB address 172.16.42.1)
# to let a laptop's harness reach it over the USB link.
LISTEN_HOST=127.0.0.1

# Number of inference threads.
# On sm8250 (S20 FE) the three Kryo 585 Gold cores (4-6) are ideal.
THREADS=3

# Context window in tokens. Smaller is cheaper: 32K suits one agent task.
CTX_SIZE=32768

# GPU layers to offload (0 = CPU only, the mainline default until Adreno/Vulkan).
GPU_LAYERS=0

# CPU affinity mask for llama-server threads.
# Comma-separated core range, e.g. "4-6" or "4,5,6".
# Leave empty to let the OS schedule.
CPU_AFFINITY=4-6

# Idle timeout in seconds before llama-server is killed.
IDLE_TIMEOUT=180

# Port the supervisor listens on (must be 8080 for OpenAI compat).
LISTEN_PORT=8080

# Internal port for llama-server (private, loopback only).
LLAMA_PORT=18080
