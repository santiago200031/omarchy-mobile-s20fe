[package]
name = "omamobile-ai"
version = "0.1.0"
edition = "2021"
description = "On-device AI supervisor with lazy llama-server management"

[[bin]]
name = "omamobile-ai"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
