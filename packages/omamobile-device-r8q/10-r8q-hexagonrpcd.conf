# SPDX-License-Identifier: MIT
# Point hexagonrpcd-sdsp at r8q's device-local sensor tree and only start once
# the extracted vendor/persist sensor configs have been staged there.
[Unit]
ConditionPathExists=/usr/share/qcom/sm8250/samsung/r8q/sensors/sns_reg.conf

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom/sm8250/samsung/r8q
