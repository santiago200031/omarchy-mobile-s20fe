# r8q: no idle action from the seat, and no power-key handling by logind.
#
# The power key has no driver wake path yet (see 10-r8q-no-suspend.conf), so
# logind must not act on it; the shell's own key handling (omamobile-keys on
# other devices, Hyprland here) owns it. IdleAction stays "ignore" so an idle
# seat never reaches the sleep targets this package masks.
[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
IdleAction=ignore
