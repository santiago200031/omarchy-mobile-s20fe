# r8q: refuse suspend until the kernel can wake from it.
#
# On this port s2idle never comes back: the phone enters the freeze and no
# wake source (power key, USB, RTC) gets through, so the only way out is a
# PMIC hard reset (Power held ~20 s). Until the sm8250 wake path is fixed,
# logind must refuse every suspend request. This is the gate every caller
# goes through ("systemctl suspend", the sleep targets, Omarchy's idle
# daemon), so one file keeps the phone usable.
#
# Delete this file (or set AllowSuspend=yes) once a suspend test has woken
# on the power key. device/r8q/PORT-PLAN.md records the open work.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
