# SPDX-License-Identifier: MIT
# r8q: let a wedged phone recover itself.
#
# The qcom-wdt APSS watchdog is built into the kernel (CONFIG_QCOM_WDT=y).
# PID 1 pets it; if userspace wedges — the s2idle freeze this port still has,
# or any other hang — the phone reboots after RuntimeWatchdogSec instead of
# needing a PMIC hard reset (Power held ~20 s) and losing the session.
#
# Keep the margin generous: llvmpipe rendering can load every core, and a
# false positive would reboot a working phone.
[Manager]
RuntimeWatchdogSec=120s
RebootWatchdogSec=10min
