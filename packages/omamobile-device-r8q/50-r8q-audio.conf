# Q6ASM FE advertises S24_LE with a different word alignment than PipeWire
# expects, so pin internal capture on r8q to S16LE @ 48 kHz (matching the
# sm8250 BE hw_params fixup).

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.platform-sound.HiFi__Mic__source"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
]
