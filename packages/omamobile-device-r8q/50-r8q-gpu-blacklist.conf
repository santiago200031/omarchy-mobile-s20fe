# r8q: keep the Adreno kernel driver unbound until the GPU path is ready.
#
# The extracted a650 SQE firmware (version 93) is older than what this kernel
# requires (>= 95), so msm loads, Adreno probe fails, and Mesa has no working
# render node: Hyprland then aborts during startup. The display runs on
# simpledrm either way, so blacklist msm until newer firmware is staged and
# the GPU render path is brought up on purpose (PORT-PLAN Open item 3).
blacklist msm
