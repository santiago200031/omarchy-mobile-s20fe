# Omarchy Mobile: VM tuning for Samsung Galaxy S20 FE (r8q) 6 GB LPDDR5 RAM
# Keeps 120 Hz UI fluid while running local LLM / subagent background tasks
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.compaction_proactiveness = 0
# Cap dirty pagecache on 6 GB RAM + UFS so large writes (model pushes, package
# installs) flush steadily instead of stalling reclaim and watchdog feeders.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
