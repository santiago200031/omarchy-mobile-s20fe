# Omarchy Mobile: Wi-Fi power save on for the S20 FE's QCA6390 (3 = enable), matching Pixel 8 Pro / 9a.
# Installed in /etc, not /usr/lib, and named zz so it sorts after
# /etc/NetworkManager/conf.d/omarchy-wifi-powersave.conf (omarchy-settings, wifi.powersave=2).
[connection]
wifi.powersave=3
