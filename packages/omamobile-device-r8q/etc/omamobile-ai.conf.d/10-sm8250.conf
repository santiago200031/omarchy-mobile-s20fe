# sm8250 (S20 FE) tuning for omamobile-ai.
#
# The Snapdragon 865 has an asymmetric 4+3+1 layout:
#   cpu0-3 — Kryo 585 Silver (1.80 GHz, Cortex-A55) × 4
#   cpu4-6 — Kryo 585 Gold (2.42 GHz, Cortex-A77) × 3
#   cpu7   — Kryo 585 Prime (2.84 GHz, Cortex-A77) × 1
#
# Inference threads use all 4 Cortex-A77 cores (4-7: 3x Gold 2.42 GHz +
# 1x Prime 2.84 GHz) for peak Q8_0 prompt speed (75.8 tok/s pp512 vs 70.2
# on 4-6 in performance profile), leaving 0-3 (Silver) for the desktop
# and system. omamobile-ai spawns llama-server lazily on demand and shuts
# it down automatically after IDLE_TIMEOUT (180 s) of inactivity.

# Pin inference to the three Gold + Prime Cortex-A77 cores (4-7).
CPU_AFFINITY=4-7

# Four threads for four Cortex-A77 cores — one-to-one mapping.
THREADS=4

# Avoid holding mmap page cache alongside CPU_REPACK buffers (-1.3 GiB RAM),
# and cap server slots at 2 with unified KV so each slot gets the full 32K ctx.
LOAD_MODE=none
PARALLEL=2
KV_UNIFIED=1

# Unload llama-server automatically after 180 s of inactivity (TTL) on battery.
IDLE_TIMEOUT=180

# While USB-connected and serving, hold powerprofilesctl performance (unlocking
# 2.42 / 2.84 GHz) and keep LFM3 resident in RAM; drop boost after 60 s idle
# or immediately on USB unplug / >=85 C thermal guard.
USB_BOOST=1
USB_IDLE_TIMEOUT=0
BOOST_IDLE_TIMEOUT=60
BOOST_PROFILE=performance
BOOST_MAX_TEMP_MC=85000

# Let the laptop's harness (Pi, VSCode) reach the daemon over the USB link
# at 172.16.42.1:8080. On Wi-Fi this would also expose it on the LAN;
# narrow it to 172.16.42.1 if ufw blocks or you want USB only.
LISTEN_HOST=0.0.0.0
