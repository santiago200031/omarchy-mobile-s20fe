# sm8250 (S20 FE) tuning for omamobile-ai.
#
# The Snapdragon 865 has an asymmetric 4+3+1 layout:
#   cpu0-3 — Kryo 585 Silver (1.80 GHz, Cortex-A55) × 4
#   cpu4-6 — Kryo 585 Gold (2.42 GHz, Cortex-A77) × 3
#   cpu7   — Kryo 585 Prime (2.84 GHz, Cortex-A77) × 1
#
# Inference threads should use the three homogeneous Gold cores (4-6)
# to saturate LPDDR5 bandwidth while leaving 0-3 and 7 free for Hyprland,
# audio, and system bursts. Using powerprofilesctl "performance" unlocks
# full 2.42 GHz on 4-6 (vs 1.77 GHz in balanced, +24% prompt speed).

# Pin inference to the three Gold cores (4-6).
CPU_AFFINITY=4-6

# Three threads for three cores — one-to-one mapping.
THREADS=3

# Let the laptop's harness (Pi, VSCode) reach the daemon over the USB link
# at 172.16.42.1:8080. On Wi-Fi this would also expose it on the LAN;
# narrow it to 172.16.42.1 if ufw blocks or you want USB only.
LISTEN_HOST=0.0.0.0
