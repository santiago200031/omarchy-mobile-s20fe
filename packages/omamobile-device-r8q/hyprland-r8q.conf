# SPDX-License-Identifier: MIT
# Omarchy Mobile: Hyprland baseline for r8q (S6E3FC3 / AMS646YD01 AMOLED on msm/Adreno 650).
# Pin DSI-1 at 60 Hz for stable panel TE / compositor frame pacing, and keep
# blur, shadow, and animations off until Mesa freedreno perf is tuned.
monitor = DSI-1,1080x2400@60,0x0,2.25

misc {
    vrr = 0
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}
