# SPDX-License-Identifier: MIT
# Omarchy Mobile: Hyprland baseline for r8q (S6E3FC3 AMOLED on simpledrm).
# The panel runs on the bootloader's live scanout via simpledrm, so Hyprland
# renders with llvmpipe (no GPU yet). Blur, shadow and animations cost ~291%
# CPU at 1080x2400; keep them off until the Adreno render path lands.
# tools/r8q-optimize applies the same profile to the live user config.
misc {
    vfr = true
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}
