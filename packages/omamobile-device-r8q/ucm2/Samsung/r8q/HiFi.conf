# SPDX-License-Identifier: MIT
# HiFi verb for Qualcomm SM8250 sound card on Samsung Galaxy S20 FE (r8q)
# Routes audio to dual CS35L40 amplifiers (Top/Earpiece & Bottom/Speaker)

SectionVerb {
	EnableSequence [
		cset "name='Left PCM Source' DSP"
		cset "name='Right PCM Source' DSP"
		cset "name='Left Boost Enable' Enabled"
		cset "name='Right Boost Enable' Enabled"
		cset "name='Left DSP RX2 Source' ASPRX1"
		cset "name='Right DSP RX2 Source' ASPRX1"
		cset "name='Left AMP Enable Switch' 1"
		cset "name='Right AMP Enable Switch' 1"
		cset "name='Left AMP PCM Gain' 18"
		cset "name='Right AMP PCM Gain' 18"
		cset "name='Left Digital PCM Volume' 817"
		cset "name='Right Digital PCM Volume' 817"
	]

	DisableSequence [
		cset "name='Left AMP Enable Switch' 0"
		cset "name='Right AMP Enable Switch' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo Speakers"

	EnableSequence [
		cset "name='Left AMP Enable Switch' 1"
		cset "name='Right AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='Left AMP Enable Switch' 0"
		cset "name='Right AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='Left AMP Enable Switch' 1"
		cset "name='Left AMP PCM Gain' 5"
		cset "name='Left Digital PCM Volume' 761"
	]

	DisableSequence [
		cset "name='Left AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
}
