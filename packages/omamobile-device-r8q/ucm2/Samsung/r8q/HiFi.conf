# SPDX-License-Identifier: MIT
# HiFi verb for Qualcomm SM8250 sound card on Samsung Galaxy S20 FE (r8q)
# Routes MultiMedia1 -> PRIMARY_TDM_RX_0 -> dual CS35L41 amplifiers.

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='Left PCM Source' ASP"
		cset "name='Right PCM Source' ASP"
		cset "name='Left Analog PCM Volume' 18"
		cset "name='Right Analog PCM Volume' 18"
		cset "name='Left Digital PCM Volume' 817"
		cset "name='Right Digital PCM Volume' 817"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo Speakers"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Left Analog PCM Volume' 18"
		cset "name='Right Analog PCM Volume' 18"
		cset "name='Left Digital PCM Volume' 817"
		cset "name='Right Digital PCM Volume' 817"
	]

	DisableSequence [
		cset "name='Left Digital PCM Volume' 0"
		cset "name='Right Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Left Analog PCM Volume' 5"
		cset "name='Left Digital PCM Volume' 761"
		cset "name='Right Digital PCM Volume' 0"
	]

	DisableSequence [
		cset "name='Left Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
}
