# HiFi verb for Qualcomm SM8250 sound card on Samsung Galaxy S20 FE (r8q)
# Routes MultiMedia1 -> PRIMARY_TDM_RX_0 -> dual CS35L41 amplifiers.

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='Left PCM Source' ASP"
		cset "name='Right PCM Source' ASP"
		cset "name='Left Analog PCM Volume' 10"
		cset "name='Right Analog PCM Volume' 10"
		cset "name='Left Digital PCM Volume' 657"
		cset "name='Right Digital PCM Volume' 657"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo Speakers"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Left Analog PCM Volume' 10"
		cset "name='Right Analog PCM Volume' 10"
		cset "name='Left Digital PCM Volume' 657"
		cset "name='Right Digital PCM Volume' 657"
	]

	DisableSequence [
		cset "name='Left Digital PCM Volume' 0"
		cset "name='Right Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Left Analog PCM Volume' 5"
		cset "name='Left Digital PCM Volume' 657"
		cset "name='Right Digital PCM Volume' 0"
	]

	DisableSequence [
		cset "name='Left Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
}

If.capture_d2 {
	Condition {
		Type Path
		Mode exist
		Path "/sys/class/sound/card0/pcmC0D2c"
	}
	True.Define.CapturePcmDev "2"
	False.Define.CapturePcmDev "1"
}

If.dmic {
	Condition {
		Type ControlExists
		Control "name='VA DMIC MUX0'"
	}
	True {
		SectionVerb {
			EnableSequence [
				cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
			]

			DisableSequence [
				cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
			]
		}

		SectionDevice."Mic" {
			Comment "Internal Microphone"

			EnableSequence [
				cset "name='VA DEC0 MUX' VA_DMIC"
				cset "name='VA DMIC MUX0' DMIC3"
				cset "name='VA_AIF1_CAP Mixer DEC0' 1"
				cset "name='VA_DEC0 Volume' 100"
			]

			DisableSequence [
				cset "name='VA DMIC MUX0' ZERO"
				cset "name='VA_DEC0 Volume' 0"
				cset "name='VA_AIF1_CAP Mixer DEC0' 0"
			]

			Value {
				CapturePriority 100
				CapturePCM "hw:${CardId},${var:CapturePcmDev}"
				CaptureChannels 1
			}
		}
	}
}
