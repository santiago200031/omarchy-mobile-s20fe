# SPDX-License-Identifier: MIT
# The r8q autologin session is `uwsm start ...`, which returns once the
# compositor is up. SDDM reads that as the session ending; with the
# firstboot's Relogin=true it starts a fresh autologin every second, spinning
# systemd-logind and journald (about 12,700 journal lines/min, CPU zones past
# 80 C) while the desktop is already running. One autologin, no retry.
[Autologin]
Relogin=false
